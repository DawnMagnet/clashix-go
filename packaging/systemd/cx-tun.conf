# Drop-in for TUN mode. Install to /etc/systemd/system/cx.service.d/tun.conf
# and run: sudo systemctl daemon-reload && sudo systemctl restart cx
[Service]
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
DeviceAllow=/dev/net/tun rw
PrivateDevices=no
