name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            upx: true
          - os: linux
            arch: arm64
            upx: true
          - os: linux
            arch: arm
            goarm: "7"
            upx: true
          - os: darwin
            arch: amd64
            upx: false
          - os: darwin
            arch: arm64
            upx: false
          - os: windows
            arch: amd64
            upx: true
          - os: windows
            arch: arm64
            upx: true
          - os: freebsd
            arch: amd64
            upx: false
          - os: freebsd
            arch: arm64
            upx: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: gobuild-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: gobuild-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('go.sum') }}-

      - name: Cache web panel assets
        id: ui-cache
        uses: actions/cache@v4
        with:
          path: internal/ui/dist
          key: ui-${{ hashFiles('scripts/fetch-ui.sh') }}

      - name: Fetch web panel assets
        if: steps.ui-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch-ui.sh

      - name: Build binary
        id: build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          name="cx-${GOOS}-${GOARCH}${ext}"
          mkdir -p dist
          go build -tags "ui with_gvisor no_zerotier no_easytier no_tailscale" -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/${name}" ./cmd/cx
          echo "name=${name}" >> "${GITHUB_OUTPUT}"

      # UPX 5.2.1 supports linux/amd64, linux/arm64, linux/arm, win64/pe, and
      # win64/arm64 PE. FreeBSD amd64/arm64 and darwin are intentionally skipped.
      - name: Cache pinned UPX
        if: matrix.upx
        id: upx-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/upx-5.2.1-amd64_linux.tar.xz
          key: upx-5.2.1-402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657

      - name: Install pinned UPX
        if: matrix.upx
        shell: bash
        env:
          UPX_VERSION: "5.2.1"
          UPX_SHA256: "402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          [ -f "${archive}" ] || curl -fsSL --retry 3 -o "${archive}" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          echo "${UPX_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/upx"
          tar -xJf "${archive}" -C "${RUNNER_TEMP}/upx"
          echo "${RUNNER_TEMP}/upx/upx-${UPX_VERSION}-amd64_linux" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/upx/upx-${UPX_VERSION}-amd64_linux/upx" --version

      - name: Compress with UPX
        if: matrix.upx
        shell: bash
        env:
          NAME: ${{ steps.build.outputs.name }}
        run: |
          set -euo pipefail
          # -7 takes ~1/4 of the time of -9/--best for ~1 MB (~6%) larger output.
          upx -7 -q "dist/${NAME}"
          upx -t "dist/${NAME}"
          upx -l "dist/${NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/${{ steps.build.outputs.name }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for file in cx-*; do
            sha256sum "${file}"
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          extract_notes() {
            local version="$1"
            awk -v header="## ${version} - " '
              index($0, header) == 1 { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md
          }

          notes="$(extract_notes "${RELEASE_TAG}")"
          if [ -z "${notes}" ] && [[ "${RELEASE_TAG}" == *-* ]]; then
            base_version="${RELEASE_TAG%%-*}"
            notes="$(extract_notes "${base_version}")"
          fi
          if [ -z "${notes}" ]; then
            notes="Release ${RELEASE_TAG}"
          fi
          printf '%s\n' "${notes}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/cx-*
            dist/SHA256SUMS
