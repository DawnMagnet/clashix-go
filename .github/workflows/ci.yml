name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: gofmt, vet, short tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch web panel assets
        run: ./scripts/fetch-ui.sh

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet -tags "no_zerotier no_easytier no_tailscale" ./...

      - name: Test (short)
        run: go test -short -tags "no_zerotier no_easytier no_tailscale" ./...

      - name: Build with bundled panel
        run: go build -tags "ui no_zerotier no_easytier no_tailscale" ./...

  test:
    name: full tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -tags "no_zerotier no_easytier no_tailscale" ./...

  cross-build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
            goarm: "7"
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: freebsd
            arch: amd64
          - os: freebsd
            arch: arm64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch web panel assets
        run: ./scripts/fetch-ui.sh

      - name: Build
        run: go build -tags "ui no_zerotier no_easytier no_tailscale" ./...
