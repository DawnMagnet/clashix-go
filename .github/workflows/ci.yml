name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: gofmt, vet, short tests
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-check-linux-amd64-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: gobuild-check-linux-amd64-${{ hashFiles('go.sum') }}-

      - name: Cache web panel assets
        id: ui-cache
        uses: actions/cache@v4
        with:
          path: internal/ui/dist
          key: ui-${{ hashFiles('scripts/fetch-ui.sh') }}

      - name: Fetch web panel assets
        if: steps.ui-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch-ui.sh

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet -tags "with_gvisor no_zerotier no_easytier no_tailscale" ./...

      - name: Test
        run: go test -tags "with_gvisor no_zerotier no_easytier no_tailscale" ./...

      - name: Test with bundled panel
        run: go test -short -tags "ui with_gvisor no_zerotier no_easytier no_tailscale" ./...

      - name: Build with bundled panel
        run: go build -tags "ui with_gvisor no_zerotier no_easytier no_tailscale" ./...

  test:
    name: full tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false  # module + build caches handled below

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ${{ runner.os == 'Windows' && '~/AppData/Local/go-build' || '~/Library/Caches/go-build' }}
          key: gobuild-test-${{ matrix.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: gobuild-test-${{ matrix.os }}-${{ hashFiles('go.sum') }}-

      # Linux runs the full suite in the check job; other OSes run -short.
      - name: Test (short)
        run: go test -short -tags "with_gvisor no_zerotier no_easytier no_tailscale" ./...

  cross-build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
            goarm: "7"
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: freebsd
            arch: amd64
          - os: freebsd
            arch: arm64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: gobuild-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('go.sum') }}-

      - name: Cache web panel assets
        id: ui-cache
        uses: actions/cache@v4
        with:
          path: internal/ui/dist
          key: ui-${{ hashFiles('scripts/fetch-ui.sh') }}

      - name: Fetch web panel assets
        if: steps.ui-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch-ui.sh

      # Same flags as release.yml so the tag build reuses this build cache.
      - name: Build
        run: go build -tags "ui with_gvisor no_zerotier no_easytier no_tailscale" -trimpath -ldflags "-s -w" -o /dev/null ./cmd/cx
